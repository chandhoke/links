<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F7D31B" />
    <link rel="icon" href="data:," />
    <title>Tech-Eyes Wetaskiwin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Public+Sans:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: light dark;
        --yellow: #f7d31b;
        --ink: #23271a;
        --paper: #fffdf2;
        --muted: #5e624f;
        --line: rgba(35, 39, 26, 0.18);
        --button-shadow: 0 6px 0 #23271a;
      }

      * { box-sizing: border-box; }

      html { min-height: 100%; background: var(--yellow); }

      body {
        min-height: 100svh;
        margin: 0;
        color: var(--ink);
        background:
          linear-gradient(145deg, transparent 0 47%, rgba(35, 39, 26, 0.045) 47% 53%, transparent 53%) 0 0 / 32px 32px,
          var(--yellow);
        font-family: "Public Sans", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      main {
        width: min(100%, 560px);
        min-height: 100svh;
        margin: 0 auto;
        padding: max(32px, env(safe-area-inset-top)) 20px max(34px, env(safe-area-inset-bottom));
        display: grid;
        align-content: center;
      }

      .panel {
        position: relative;
        overflow: hidden;
        padding: clamp(28px, 8vw, 48px) clamp(22px, 7vw, 42px) clamp(30px, 8vw, 44px);
        background: var(--paper);
        border: 3px solid var(--ink);
        box-shadow: 10px 10px 0 rgba(35, 39, 26, 0.22);
      }

      .panel::before {
        content: "";
        position: absolute;
        inset: 0 0 auto;
        height: 10px;
        background: var(--ink);
      }

      h1 {
        max-width: 10ch;
        margin: 0;
        font-family: "Barlow Condensed", sans-serif;
        font-size: clamp(3rem, 13vw, 5rem);
        font-weight: 800;
        line-height: 0.84;
        letter-spacing: -0.045em;
        text-transform: uppercase;
      }

      .tagline {
        margin: 20px 0 0;
        font-family: "Barlow Condensed", sans-serif;
        font-size: clamp(1.45rem, 6vw, 2rem);
        font-weight: 700;
        line-height: 1;
      }

      .tagline span {
        display: inline;
        padding: 2px 6px 3px;
        background: var(--yellow);
        box-decoration-break: clone;
        -webkit-box-decoration-break: clone;
      }

      .details {
        margin: 24px 0 0;
        padding: 18px 0;
        border-block: 1px solid var(--line);
      }

      .details p {
        display: flex;
        align-items: flex-start;
        gap: 11px;
        margin: 0;
        font-size: 0.94rem;
        font-weight: 600;
        line-height: 1.45;
      }

      .details p + p { margin-top: 10px; }

      .details svg {
        flex: 0 0 auto;
        width: 19px;
        height: 19px;
        margin-top: 1px;
        stroke-width: 2.2;
      }

      .actions {
        display: grid;
        gap: 16px;
        margin-top: 25px;
      }

      .action {
        min-height: 64px;
        display: grid;
        grid-template-columns: 28px 1fr 22px;
        align-items: center;
        gap: 13px;
        padding: 15px 17px;
        color: var(--ink);
        background: var(--yellow);
        border: 2px solid var(--ink);
        box-shadow: var(--button-shadow);
        text-decoration: none;
        font-family: "Barlow Condensed", sans-serif;
        font-size: 1.42rem;
        font-weight: 800;
        line-height: 1;
        letter-spacing: 0.01em;
        text-transform: uppercase;
        touch-action: manipulation;
        transition: transform 120ms ease, box-shadow 120ms ease, background-color 120ms ease;
      }

      .action svg {
        width: 25px;
        height: 25px;
        stroke-width: 2.3;
      }

      .action .arrow {
        width: 20px;
        height: 20px;
        justify-self: end;
      }

      .action-text {
        display: grid;
        gap: 3px;
      }

      .action-text small {
        font-family: "Public Sans", sans-serif;
        font-size: 0.72rem;
        font-weight: 700;
        line-height: 1.1;
        letter-spacing: 0.01em;
        text-transform: none;
      }

      .call-fallback {
        margin-top: -2px;
        padding: 12px 14px;
        color: var(--ink);
        background: var(--paper);
        border: 2px solid var(--ink);
        font-size: 0.82rem;
        font-weight: 700;
        line-height: 1.35;
      }

      .call-fallback p { margin: 0; }

      .copy-number {
        margin-top: 9px;
        padding: 9px 12px;
        color: var(--paper);
        background: var(--ink);
        border: 0;
        border-radius: 0;
        font: 700 0.82rem/1 "Public Sans", sans-serif;
        cursor: pointer;
        touch-action: manipulation;
      }

      .copy-status {
        display: block;
        min-height: 1.1em;
        margin-top: 7px;
        color: var(--muted);
        font-size: 0.76rem;
      }

      .action:hover { background: #ffe45e; }

      .action:active {
        transform: translateY(4px);
        box-shadow: 0 2px 0 var(--ink);
      }

      .action:focus-visible {
        outline: 4px solid var(--ink);
        outline-offset: 4px;
      }

      @media (max-width: 370px) {
        main { padding-inline: 14px; }
        .panel { padding-inline: 18px; }
        .action { font-size: 1.25rem; }
      }

      @media (min-width: 700px) {
        main { padding-block: 48px; }
      }

      @media (prefers-reduced-motion: reduce) {
        .action { transition: none; }
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #202319;
          --ink: #fffbea;
          --muted: #d9d6c7;
          --line: rgba(255, 251, 234, 0.22);
          --button-shadow: 0 6px 0 #fffbea;
        }

        html { background: #10120d; }
        body {
          background:
            linear-gradient(145deg, transparent 0 47%, rgba(247, 211, 27, 0.055) 47% 53%, transparent 53%) 0 0 / 32px 32px,
            #10120d;
        }
        .panel {
          border-color: #f7d31b;
          box-shadow: 10px 10px 0 rgba(247, 211, 27, 0.18);
        }
        .panel::before { background: var(--yellow); }
        .tagline span, .action { color: #23271a; }
        .action { border-color: var(--yellow); box-shadow: 0 6px 0 var(--yellow); }
        .call-fallback { border-color: var(--yellow); }
        .copy-number { color: #23271a; background: var(--yellow); }
        .action:hover { background: #ffe45e; }
        .action:active { box-shadow: 0 2px 0 var(--yellow); }
        .action:focus-visible { outline-color: var(--yellow); }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="panel" aria-labelledby="shop-name">
        <h1 id="shop-name">Tech-Eyes Wetaskiwin</h1>
        <p class="tagline"><span>We Fix. You Relax.</span></p>

        <div class="details" aria-label="Store details">
          <p>
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v5l3.4 2"/></svg>
            <span>Open 7 days: Mon-Fri 10-6, Sat-Sun 11-5</span>
          </p>
          <p>
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>
            <span>3725 56 St, Unit 1540 (Wetaskiwin Mall)</span>
          </p>
        </div>

        <nav class="actions" aria-label="Contact and location links">
          <a class="action" id="call-link" href="tel:+17809007741" target="_self" aria-label="Call Tech-Eyes Wetaskiwin at 780-900-7741">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M7.2 3.5 10 7.7 7.8 10a15 15 0 0 0 6.2 6.2l2.3-2.2 4.2 2.8v3a1.7 1.7 0 0 1-1.7 1.7A16.3 16.3 0 0 1 2.5 5.2a1.7 1.7 0 0 1 1.7-1.7h3Z"/></svg>
            <span class="action-text"><span>Call now</span><small>(780) 900-7741</small></span>
            <svg class="arrow" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m9 5 7 7-7 7"/></svg>
          </a>

          <div class="call-fallback" id="call-fallback" hidden tabindex="-1">
            <p>If Instagram blocks the dialer, copy the number and call from your Phone app.</p>
            <button class="copy-number" id="copy-number" type="button">Copy (780) 900-7741</button>
            <span class="copy-status" id="copy-status" role="status" aria-live="polite"></span>
          </div>

          <a class="action" href="https://www.google.com/maps/search/?api=1&amp;query=Tech-Eyes+Wetaskiwin+3725+56+St+Unit+1540+Wetaskiwin+AB" target="_self" aria-label="Get directions to Tech-Eyes Wetaskiwin">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m12 3 9 9-9 9-9-9 9-9Z"/><path d="M8 13v-2h7m-2-2 2 2-2 2"/></svg>
            <span>Directions</span>
            <svg class="arrow" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m9 5 7 7-7 7"/></svg>
          </a>

          <a class="action" href="https://www.google.com/maps/place/Tech-Eyes+Wetaskiwin+Store/@52.9538947,-113.3881096,17z/data=!3m1!4b1!4m6!3m5!1s0x53754f7fa376ccd3:0xbe87fc26fa25518e!8m2!3d52.9538947!4d-113.3881096!16s%2Fg%2F11vp_qwcls" target="_self" aria-label="Leave Tech-Eyes Wetaskiwin a Google review">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9L12 3Z"/></svg>
            <span>Leave a Google review</span>
            <svg class="arrow" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m9 5 7 7-7 7"/></svg>
          </a>
        </nav>
      </section>
    </main>
    <script>
      (function () {
        var callLink = document.getElementById("call-link");
        var fallback = document.getElementById("call-fallback");
        var copyButton = document.getElementById("copy-number");
        var copyStatus = document.getElementById("copy-status");
        var phone = "+17809007741";

        callLink.addEventListener("click", function () {
          fallback.hidden = false;
          fallback.focus();
        });

        copyButton.addEventListener("click", function () {
          var fallbackTimer;

          function showCopied() {
            window.clearTimeout(fallbackTimer);
            copyStatus.textContent = "Number copied.";
            copyButton.textContent = "Copied";
          }

          function showManualFallback() {
            window.clearTimeout(fallbackTimer);
            copyStatus.textContent = "If it did not copy, press and hold the number on the Call button.";
          }

          copyStatus.textContent = "Copying number…";
          fallbackTimer = window.setTimeout(showManualFallback, 1200);

          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(phone).then(showCopied, showManualFallback);
          } else {
            var field = document.createElement("textarea");
            field.value = phone;
            field.setAttribute("readonly", "");
            field.style.position = "fixed";
            field.style.opacity = "0";
            document.body.appendChild(field);
            field.select();
            try {
              if (document.execCommand("copy")) showCopied();
              else showManualFallback();
            } catch (error) {
              showManualFallback();
            }
            field.remove();
          }
        });
      })();
    </script>
  </body>
</html>
